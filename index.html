<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Spot — The Wolverines</title>
<meta name="theme-color" content="#0b1118" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b1118;
    --bg-2: #0f1620;
    --card: #141b26;
    --card-2: #1a2230;
    --line: #233149;
    --text: #e8edf5;
    --text-dim: #98a4b6;
    --text-mute: #5e6a80;
    --maize: #FFCB05;
    --maize-glow: #ffe45c;
    --blue: #2e7dff;
    --blue-2: #5b9bff;
    --good: #22c55e;
    --bad: #ef4444;
    --shadow: 0 12px 32px rgba(0,0,0,.45);
    --shadow-hover: 0 18px 48px rgba(0,0,0,.6);
  }

  /* Reset + base */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(255,203,5,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 90%, rgba(46,125,255,.08), transparent 50%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--blue); }

  /* ===== Topbar ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    background: rgba(11,17,24,.75);
    backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 50;
  }
  .brand { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, var(--maize) 0%, #e0a800 100%);
    display: grid; place-items: center; color: #1a1a1a;
    box-shadow: 0 6px 20px rgba(255,203,5,.25);
  }
  .brand .logo svg { width: 22px; height: 22px; }
  .brand .title { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  .brand .sub   { font-size: 11px; color: var(--text-dim); letter-spacing: .04em; }

  .crumbs { display: flex; gap: 8px; align-items: center; color: var(--text-dim); font-size: 13px; }
  .crumbs .crumb { color: var(--text-dim); cursor: pointer; transition: color .15s ease; }
  .crumbs .crumb:hover { color: var(--maize); }
  .crumbs .sep { color: var(--text-mute); }

  /* ===== Views ===== */
  .view {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 24px 80px;
    animation: viewIn .35s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Landing: Who's studying? ===== */
  .who-pad { padding: 36px 8px 0; text-align: center; }
  .who-tag {
    display: inline-block;
    background: rgba(255,203,5,.12);
    border: 1px solid rgba(255,203,5,.3);
    color: var(--maize);
    font-size: 11px; font-weight: 800;
    letter-spacing: .18em; text-transform: uppercase;
    padding: 7px 14px; border-radius: 999px;
  }
  .who-h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 9vw, 88px);
    letter-spacing: .01em; line-height: 1;
    background: linear-gradient(135deg, var(--maize-glow), #ffffff 50%, var(--maize));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 16px 0 10px;
  }
  .who-sub { color: var(--text-dim); font-size: 16px; max-width: 540px; margin: 0 auto 36px; }

  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 32px;
  }
  .roommate {
    background: linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 18px;
    text-align: left;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .25s ease, box-shadow .25s ease;
    position: relative;
    overflow: hidden;
  }
  .roommate::before {
    content: ""; position: absolute; inset: -1px; border-radius: 18px;
    background: linear-gradient(135deg, var(--maize), var(--blue));
    opacity: 0; transition: opacity .25s ease; pointer-events: none;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    padding: 1px;
  }
  .roommate:hover { transform: translateY(-4px); border-color: transparent; box-shadow: var(--shadow-hover); }
  .roommate:hover::before { opacity: 1; }
  .roommate .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--card-2);
    border: 2px solid var(--line);
    display: grid; place-items: center; font-weight: 800; font-size: 22px;
    margin-bottom: 14px;
    color: var(--maize);
    overflow: hidden;
    transition: transform .35s cubic-bezier(.2,.7,.2,1), border-color .25s ease;
  }
  .roommate:hover .avatar { transform: scale(1.06); border-color: var(--maize); }
  .roommate .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .roommate .name { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .roommate .meta { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .roommate .tag {
    display: inline-block; margin-top: 12px;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
  }
  .roommate .tag.live { color: var(--maize); border-color: rgba(255,203,5,.35); background: rgba(255,203,5,.07); }

  .house-cta {
    margin-top: 48px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .house-cta .txt { color: var(--text-dim); font-size: 14px; }
  .house-cta .txt b { color: var(--text); }

  /* ===== Student dashboard (class grid) ===== */
  .stu-hero { padding: 24px 8px 4px; }
  .stu-hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 7vw, 64px);
    letter-spacing: .01em; line-height: 1;
    background: linear-gradient(135deg, var(--maize-glow), var(--maize));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stu-hero .sub { color: var(--text-dim); margin-top: 6px; font-size: 14px; }
  .stu-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0 6px; }
  .stu-stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .stu-stat .v { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--maize); }
  .stu-stat .k { font-size: 10.5px; color: var(--text-dim); margin-top: 4px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

  .class-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px; margin-top: 22px;
  }
  .class-tile {
    position: relative;
    background: linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 18px 18px;
    cursor: pointer;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .25s ease, box-shadow .25s ease;
  }
  .class-tile::after {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,203,5,.08), transparent 70%);
    opacity: 0; transition: opacity .3s ease;
  }
  .class-tile:hover { transform: translateY(-3px); border-color: var(--maize); box-shadow: var(--shadow-hover); }
  .class-tile:hover::after { opacity: 1; }
  .class-tile .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 600;
    color: var(--maize);
    background: rgba(255,203,5,.1);
    border: 1px solid rgba(255,203,5,.25);
    padding: 4px 8px; border-radius: 6px;
    display: inline-block;
    margin-bottom: 10px;
  }
  .class-tile .name { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .class-tile .meta { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .class-tile .progress {
    margin-top: 14px;
    height: 6px; background: var(--line); border-radius: 999px; overflow: hidden;
  }
  .class-tile .progress > div {
    height: 100%;
    background: linear-gradient(90deg, var(--maize), var(--maize-glow));
    border-radius: 999px;
    transition: width .5s cubic-bezier(.2,.7,.2,1);
  }
  .class-tile .progress-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-dim); margin-top: 6px;
    font-weight: 700; letter-spacing: .04em;
  }

  /* ===== Class hub (placeholder) ===== */
  .hub-hero { padding: 24px 8px 0; }
  .hub-hero .top {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .hub-hero .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 700;
    color: var(--maize);
    background: rgba(255,203,5,.1);
    border: 1px solid rgba(255,203,5,.3);
    padding: 6px 12px; border-radius: 8px;
  }
  .hub-hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 7vw, 60px);
    letter-spacing: .01em; line-height: 1; color: var(--text);
    margin: 8px 0 4px;
  }
  .hub-hero .sub { color: var(--text-dim); }

  .mode-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 18px; }
  .mode-tab {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 11px 16px; border-radius: 12px;
    font-weight: 700; font-size: 13.5px;
    transition: all .15s ease;
  }
  .mode-tab:hover { background: var(--card-2); color: var(--text); }
  .mode-tab.active {
    background: linear-gradient(135deg, var(--maize), var(--maize-glow));
    color: #1a1a1a; border-color: transparent;
    box-shadow: 0 6px 18px rgba(255,203,5,.25);
  }

  .empty-state {
    margin-top: 18px;
    padding: 32px;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 16px;
    text-align: center;
  }
  .empty-state .ico {
    width: 60px; height: 60px; border-radius: 16px;
    background: var(--card-2);
    display: grid; place-items: center; margin: 0 auto 12px;
    color: var(--maize);
  }
  .empty-state h3 { font-size: 18px; font-weight: 800; }
  .empty-state p { color: var(--text-dim); margin-top: 6px; max-width: 460px; margin-left: auto; margin-right: auto; }
  .empty-state .cta {
    margin-top: 16px; display: inline-block;
    background: var(--maize);
    color: #1a1a1a;
    padding: 10px 18px; border-radius: 10px;
    font-weight: 800; font-size: 13.5px;
    box-shadow: 0 6px 18px rgba(255,203,5,.25);
    transition: transform .15s ease;
  }
  .empty-state .cta:hover { transform: translateY(-2px); }

  /* Notes grid (used once Dylan adds content) */
  .notes-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 12px; margin-top: 18px;
  }
  .note-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px;
    cursor: pointer;
    transition: all .15s ease;
    position: relative;
    overflow: hidden;
  }
  .note-card::after {
    content: ""; position: absolute; right: -20px; bottom: -20px;
    width: 80px; height: 80px; border-radius: 50%;
    background: var(--maize); opacity: 0; transition: opacity .25s ease;
  }
  .note-card:hover { border-color: var(--maize); transform: translateY(-2px); }
  .note-card:hover::after { opacity: .08; }
  .note-card .ch { font-size: 11px; color: var(--maize); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
  .note-card .title { font-weight: 800; margin-top: 4px; font-size: 15px; }
  .note-card .count { color: var(--text-dim); font-size: 12px; margin-top: 6px; }

  /* Search bar (top-right) */
  .search {
    position: relative;
  }
  .search input {
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 9px 14px 9px 36px;
    border-radius: 10px;
    font: inherit;
    width: 220px;
    outline: none;
    transition: all .15s ease;
  }
  .search input:focus { border-color: var(--maize); width: 280px; }
  .search input::placeholder { color: var(--text-mute); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-mute); }
  .kbd-hint { font-size: 10px; color: var(--text-mute); margin-left: 8px; }

  /* Toast for nav confirmation */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--card-2);
    border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; color: var(--text);
    box-shadow: var(--shadow);
    z-index: 100;
    animation: toastIn .25s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* Footer */
  footer {
    text-align: center;
    padding: 20px 16px 32px;
    color: var(--text-mute);
    font-size: 12px;
  }

  @media (max-width: 640px) {
    .stu-stats { grid-template-columns: repeat(2, 1fr); }
    .class-grid { grid-template-columns: 1fr; }
    .search input { width: 160px; }
    .search input:focus { width: 180px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" data-route="/">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7l9-4 9 4-9 4-9-4z"/>
        <path d="M3 12l9 4 9-4"/>
        <path d="M3 17l9 4 9-4"/>
      </svg>
    </div>
    <div>
      <div class="title">Study Spot</div>
      <div class="sub">The Wolverines · UM-Dearborn</div>
    </div>
  </div>

  <div id="crumbs" class="crumbs" style="display:none;">
    <span class="crumb" data-route="/">Home</span>
    <span class="sep">›</span>
    <span id="crumbCurrent"></span>
  </div>

  <div style="display:flex;align-items:center;">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="globalSearch" placeholder="Search notes… ( / )" />
    </div>
    <span class="kbd-hint">/</span>
  </div>
</div>

<main id="root" class="view"></main>

<footer>Built for the boys · UM-Dearborn · Go Blue 🐺</footer>

<script>
/* ============== ROUTER ============== */
const ROUTES = {};
function route(path, render) { ROUTES[path] = render; }

function go(path, opts = {}) {
  if (location.hash !== '#' + path) {
    location.hash = path;
    return; // hashchange handler will trigger render
  }
  renderRoute(path, opts);
}

function renderRoute(path, opts) {
  const handler = ROUTES[path] || ROUTES['/'];
  const root = document.getElementById('root');
  root.style.animation = 'none';
  void root.offsetWidth; // restart animation
  root.style.animation = '';
  root.innerHTML = handler(opts);
  // update breadcrumbs
  const crumbs = document.getElementById('crumbs');
  if (path === '/') {
    crumbs.style.display = 'none';
  } else {
    crumbs.style.display = 'flex';
    document.getElementById('crumbCurrent').textContent = crumbFor(path);
  }
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
}

function crumbFor(path) {
  if (path.startsWith('/u/')) {
    const name = path.split('/')[2];
    return STUDENTS[name]?.display || name;
  }
  if (path.startsWith('/c/')) {
    const code = path.split('/')[2];
    return code;
  }
  return path;
}

window.addEventListener('hashchange', () => {
  renderRoute(location.hash.slice(1) || '/');
});

/* ============== STUDENT DATA ============== */
const STUDENTS = {
  dylan: {
    display: "Dylan Thorpe",
    initials: "DT",
    major: "Engineering · Pre-Med Track",
    classes: [
      { code: "ANTH-101",  name: "Introduction to Anthropology", meta: "Section 001 · Fall 2026", progress: 12, count: "12 notes" },
      { code: "ENGR-250",  name: "Principles of Engineering Materials", meta: "Section 001 · Fall 2026", progress: 28, count: "8 notes" },
      { code: "ENGR-250R", name: "Prin of Eng Materials Recitation", meta: "Section 003 · Fall 2026", progress: 14, count: "3 notes" },
      { code: "MATH-215",  name: "Calculus III", meta: "Section 001 · Fall 2026", progress: 41, count: "16 notes" },
      { code: "PHYS-150",  name: "General Physics I", meta: "Section 003 · Fall 2026", progress: 8, count: "0 notes" },
      { code: "PHYS-150L", name: "General Physics I Lab/Disc", meta: "Section 001 · Fall 2026", progress: 6, count: "0 notes" },
    ],
  },
  charlie: {
    display: "Charlie Woodcock",
    initials: "CW",
    major: "Mechanical Engineering",
    classes: [
      { code: "ENGR-250",  name: "Principles of Engineering Materials", meta: "Section 001 · Fall 2026", progress: 22, count: "2 notes" },
      { code: "MATH-216",  name: "Differential Equations", meta: "Section 002 · Fall 2026", progress: 30, count: "9 notes" },
      { code: "ME-220",    name: "Statics", meta: "Section 001 · Fall 2026", progress: 18, count: "5 notes" },
      { code: "PHYS-150",  name: "General Physics I", meta: "Section 003 · Fall 2026", progress: 8, count: "0 notes" },
    ],
  },
  cooper: {
    display: "Cooper Hallwood",
    initials: "CH",
    major: "Accounting",
    classes: [
      { code: "ACC-289",  name: "Financial Accounting", meta: "Section 001 · Fall 2026", progress: 50, count: "32 cards" },
    ],
    note: "Cooper already has his own full study app — coop-accounting-deck",
  },
  wyatt: {
    display: "Wyatt Potter",
    initials: "WP",
    major: "Lacrosse · Business",
    classes: [
      { code: "BUS-201",  name: "Principles of Management", meta: "Fall 2026", progress: 15, count: "—" },
    ],
  },
  christian: {
    display: "Christian Van Tiem",
    initials: "CV",
    major: "Defense-first",
    classes: [
      { code: "DEF-101", name: "Lacrosse: Defense", meta: "Spring 2027", progress: 0, count: "0 notes" },
    ],
  },
};

/* ============== ROUTES ============== */

// Landing: Who's studying?
route('/', () => `
  <div class="who-pad">
    <span class="who-tag">The Wolverines · Study Spot</span>
    <h1 class="who-h1">Who's studying?</h1>
    <p class="who-sub">Pick your name to drop into your dashboard. The other roommates are placeholder — we'll flesh theirs out as they want it.</p>

    <div class="roster-grid">
      ${Object.entries(STUDENTS).map(([key, s]) => `
        <div class="roommate" data-route="/u/${key}">
          <div class="avatar">${s.initials}</div>
          <div class="name">${s.display}</div>
          <div class="meta">${s.major}</div>
          <span class="tag ${key === 'dylan' || key === 'charlie' ? 'live' : ''}">${key === 'dylan' || key === 'charlie' ? 'In progress' : s.classes.length + ' classes'}</span>
        </div>
      `).join('')}
    </div>

    <div class="house-cta">
      <div class="txt"><b>House shortcut:</b> Search with <span style="color:var(--maize);font-family:'JetBrains Mono',monospace;">/</span> &nbsp;·&nbsp; Navigate with <span style="color:var(--maize);font-family:'JetBrains Mono',monospace;">←</span> <span style="color:var(--maize);font-family:'JetBrains Mono',monospace;">→</span> &nbsp;·&nbsp; Press <span style="color:var(--maize);font-family:'JetBrains Mono',monospace;">g</span> to go home</div>
      <span class="kbd-hint">try it</span>
    </div>
  </div>
`);

// Student dashboard
route('/u/:who', (params) => {
  const s = STUDENTS[params.who];
  if (!s) return notFound();

  const totalNotes = s.classes.reduce((acc, c) => acc + (parseInt(c.count) || 0), 0);
  const avgProgress = Math.round(s.classes.reduce((a, c) => a + c.progress, 0) / s.classes.length);

  return `
    <div class="stu-hero">
      <h1>${s.display.split(' ')[0]}'s dashboard</h1>
      <div class="sub">${s.major} · Fall 2026 · ${s.classes.length} classes</div>
    </div>

    <div class="stu-stats">
      <div class="stu-stat"><div class="v">${s.classes.length}</div><div class="k">Classes</div></div>
      <div class="stu-stat"><div class="v">${totalNotes}</div><div class="k">Notes & Cards</div></div>
      <div class="stu-stat"><div class="v">${avgProgress}%</div><div class="k">Avg progress</div></div>
      <div class="stu-stat"><div class="v">${s.classes.filter(c => c.progress > 0).length}</div><div class="k">Active</div></div>
    </div>

    <div class="class-grid">
      ${s.classes.map(c => `
        <div class="class-tile" data-route="/c/${params.who}/${c.code}">
          <span class="code">${c.code}</span>
          <div class="name">${c.name}</div>
          <div class="meta">${c.meta}</div>
          <div class="progress"><div style="width:${c.progress}%"></div></div>
          <div class="progress-label">
            <span>${c.progress}%</span>
            <span>${c.count}</span>
          </div>
        </div>
      `).join('')}
    </div>

    ${s.note ? `<div class="house-cta" style="margin-top:24px;"><div class="txt">${s.note} → <a href="https://dylanthrp.github.io/coop-accounting-deck/" style="color:var(--maize);font-weight:700;">coop-accounting-deck ↗</a></div></div>` : ''}
  `;
});

// Class hub
route('/c/:who/:code', (params) => {
  const s = STUDENTS[params.who];
  if (!s) return notFound();
  const c = s.classes.find(x => x.code === params.code);
  if (!c) return notFound();

  // Default mode tab depends on whether the class has notes yet
  const cCount = parseInt(c.count) || 0;
  const hasContent = cCount > 0;
  const mode = params.mode || (hasContent ? 'notes' : 'overview');

  const tabs = [
    { id: 'overview', label: '📌 Overview' },
    { id: 'notes',    label: '📝 Notes',       badge: hasContent ? c.count : null },
    { id: 'cards',    label: '🃏 Cards',       badge: null },
    { id: 'flash',    label: '🎯 Flash Test',  badge: null },
  ].map(t => `<div class="mode-tab ${t.id === mode ? 'active' : ''}" data-mode="${t.id}">${t.label}${t.badge ? ` <span style="opacity:.65;font-weight:600;margin-left:4px;">· ${t.badge}</span>` : ''}</div>`).join('');

  let body = '';
  if (mode === 'overview') {
    body = `
      <div class="empty-state">
        <div class="ico">📚</div>
        <h3>${c.name}</h3>
        <p>${c.meta} · This is your hub. Notes, cards, and practice will live here. ${hasContent ? `${c.count} already uploaded.` : "Dylan hasn't uploaded any material yet."}</p>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px;">
          ${hasContent ? `<a class="cta" data-route="/c/${params.who}/${c.code}?mode=notes" style="cursor:pointer;">Open notes →</a>` : ''}
          <a class="cta" style="cursor:pointer;background:var(--card-2);color:var(--maize);" onclick="toast('Tell Dylan to upload your ${c.code} notes via chat and they will appear here.')">How to add notes</a>
        </div>
      </div>
    `;
  } else if (mode === 'notes') {
    body = `
      <div class="notes-grid" id="notesGrid">
        <div class="empty-state" style="grid-column:1/-1;">
          <div class="ico">📝</div>
          <h3>Notes coming soon</h3>
          <p>Once Dylan uploads his ${c.code} material (photos, PDFs, or typed text), I'll auto-organize it into chapters/topics with quick-review cards. Drop them in chat and say "add these to ${c.code}".</p>
        </div>
      </div>
    `;
  } else if (mode === 'cards' || mode === 'flash') {
    body = `
      <div class="empty-state">
        <div class="ico">${mode === 'cards' ? '🃏' : '🎯'}</div>
        <h3>${mode === 'cards' ? 'Cards' : 'Flash Test'} mode</h3>
        <p>Auto-built from your notes once uploaded. Cards use spaced repetition so the things you miss come back more often.</p>
        <p style="margin-top:14px;font-size:12px;color:var(--text-mute);">⌘ Coming after notes are uploaded</p>
      </div>
    `;
  }

  return `
    <div class="hub-hero">
      <div class="top">
        <span class="code">${c.code}</span>
        <span style="color:var(--text-dim);">·</span>
        <span style="color:var(--text-dim);">${params.who.toUpperCase()}'s hub</span>
      </div>
      <h1>${c.name}</h1>
      <div class="sub">${c.meta} · ${c.progress}% complete · ${c.count}</div>
    </div>

    <div class="mode-tabs" id="modeTabs">${tabs}</div>

    ${body}
  `;
});

// 404
function notFound() {
  return `
    <div class="empty-state" style="margin-top:60px;">
      <div class="ico">🔍</div>
      <h3>Page not found</h3>
      <p>That URL doesn't match anything here yet.</p>
      <a class="cta" onclick="go('/')" style="cursor:pointer;">← Back to home</a>
    </div>
  `;
}

/* ============== GLOBAL CLICK HANDLERS ============== */
document.addEventListener('click', (e) => {
  const navTarget = e.target.closest('[data-route]');
  if (navTarget) {
    e.preventDefault();
    go(navTarget.dataset.route);
    return;
  }
  const modeTab = e.target.closest('.mode-tab');
  if (modeTab) {
    const path = location.hash.slice(1) || '/';
    const m = path.match(/^(\/c\/[^/]+\/[^/?]+)/);
    if (m) {
      const newPath = m[1] + '?mode=' + modeTab.dataset.mode;
      history.replaceState(null, '', '#' + newPath);
      go(newPath);
    }
  }
});

/* ============== SEARCH ============== */
document.getElementById('globalSearch').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  // simple in-page filter on class names (real cross-class search comes when notes exist)
  document.querySelectorAll('.class-tile, .note-card, .roommate').forEach(el => {
    const text = el.textContent.toLowerCase();
    el.style.display = text.includes(q) ? '' : 'none';
  });
});

/* ============== KEYBOARD ============== */
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('globalSearch').focus();
  }
  if (e.key === 'g' && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    go('/');
  }
  if (e.key === 'Escape') {
    document.activeElement.blur();
    document.getElementById('globalSearch').value = '';
    document.querySelectorAll('[style*="display: none"]').forEach(el => el.style.display = '');
  }
});

/* ============== TOAST ============== */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

/* ============== INIT ============== */
window.addEventListener('DOMContentLoaded', () => {
  const path = location.hash.slice(1) || '/';
  renderRoute(path);
});
