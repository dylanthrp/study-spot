<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PHYS-150 · Study Spot</title>
<meta name="theme-color" content="#0b1118" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b1118;
    --bg-2: #0f1620;
    --card: #141b26;
    --card-2: #1a2230;
    --line: #233149;
    --text: #e8edf5;
    --text-dim: #98a4b6;
    --text-mute: #5e6a80;
    --maize: #FFCB05;
    --maize-glow: #ffe45c;
    --blue: #2e7dff;
    --blue-2: #5b9bff;
    --good: #22c55e;
    --bad: #ef4444;
    --shadow: 0 12px 32px rgba(0,0,0,.45);
    --shadow-hover: 0 18px 48px rgba(0,0,0,.6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(255,203,5,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 90%, rgba(46,125,255,.08), transparent 50%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

  /* ===== Topbar ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 28px; border-bottom: 1px solid var(--line);
    background: rgba(11,17,24,.85); backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 50;
  }
  .brand { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, var(--maize) 0%, #e0a800 100%);
    display: grid; place-items: center; color: #1a1a1a;
    box-shadow: 0 6px 20px rgba(255,203,5,.25);
  }
  .brand .logo svg { width: 22px; height: 22px; }
  .brand .title { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  .brand .sub   { font-size: 11px; color: var(--text-dim); letter-spacing: .04em; }
  .crumbs { display: flex; gap: 8px; align-items: center; color: var(--text-dim); font-size: 13px; flex: 1; margin-left: 16px; min-width: 0; overflow: hidden; }
  .crumbs .crumb { color: var(--text-dim); cursor: pointer; transition: color .15s ease; white-space: nowrap; }
  .crumbs .crumb:hover { color: var(--maize); }
  .crumbs .crumb.current { color: var(--text); cursor: default; }
  .crumbs .sep { color: var(--text-mute); }
  .toolbar { display: flex; align-items: center; gap: 10px; }
  .search { position: relative; }
  .search input {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 9px 14px 9px 36px; border-radius: 10px; font: inherit;
    width: 220px; outline: none; transition: all .15s ease;
  }
  .search input:focus { border-color: var(--maize); width: 280px; }
  .search input::placeholder { color: var(--text-mute); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-mute); }
  .kbd-hint { font-size: 10px; color: var(--text-mute); }

  /* ===== View ===== */
  .view {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px 80px;
    animation: viewIn .35s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Home (chapter list) ===== */
  .home-hero { padding: 24px 8px 4px; }
  .home-hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 7vw, 64px);
    letter-spacing: .01em; line-height: 1;
    background: linear-gradient(135deg, var(--maize-glow), var(--maize));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .home-hero .sub { color: var(--text-dim); margin-top: 6px; font-size: 14px; }
  .home-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0 6px; }
  .home-stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 16px;
  }
  .home-stat .v { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--maize); }
  .home-stat .k { font-size: 10.5px; color: var(--text-dim); margin-top: 4px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

  .chapter-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 14px; margin-top: 22px;
  }
  .chapter-tile {
    position: relative;
    background: linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line); border-radius: 16px;
    padding: 18px;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .25s ease, box-shadow .25s ease;
    overflow: hidden;
  }
  .chapter-tile::after {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,203,5,.08), transparent 70%);
    opacity: 0; transition: opacity .3s ease;
  }
  .chapter-tile:hover { transform: translateY(-3px); border-color: var(--maize); box-shadow: var(--shadow-hover); }
  .chapter-tile:hover::after { opacity: 1; }
  .chapter-tile .num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 600;
    color: var(--maize);
    background: rgba(255,203,5,.1);
    border: 1px solid rgba(255,203,5,.25);
    padding: 4px 8px; border-radius: 6px;
    display: inline-block; margin-bottom: 10px;
  }
  .chapter-tile.verified .num { color: var(--good); background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.4); }
  .chapter-tile .title { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .chapter-tile .sub { color: var(--text-dim); font-size: 12.5px; margin-top: 6px; line-height: 1.45; }
  .chapter-tile .meta { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chapter-tile .pill { background: var(--card-2); border: 1px solid var(--line); color: var(--text-dim); padding: 3px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
  .chapter-tile.verified .pill.live { color: var(--good); border-color: rgba(34,197,94,.35); background: rgba(34,197,94,.08); }

  /* ===== Chapter view (overview) ===== */
  .ch-hero { padding: 22px 8px 0; }
  .ch-hero .top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
  .ch-hero .badge {
    font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;
    color: var(--good);
    background: rgba(34,197,94,.12); border: 1px solid rgba(34,197,94,.35);
    padding: 6px 12px; border-radius: 8px;
  }
  .ch-hero .badge.pending { color: var(--text-mute); background: var(--card-2); border-color: var(--line); }
  .ch-hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 7vw, 60px);
    letter-spacing: .01em; line-height: 1;
    color: var(--text);
    margin: 8px 0 4px;
  }
  .ch-hero .sub { color: var(--text-dim); }
  .mode-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 16px; }
  .mode-tab {
    background: var(--card); border: 1px solid var(--line); color: var(--text-dim);
    padding: 11px 16px; border-radius: 12px;
    font-weight: 700; font-size: 13.5px;
    transition: all .15s ease;
  }
  .mode-tab:hover { background: var(--card-2); color: var(--text); }
  .mode-tab.active {
    background: linear-gradient(135deg, var(--maize), var(--maize-glow));
    color: #1a1a1a; border-color: transparent;
    box-shadow: 0 6px 18px rgba(255,203,5,.25);
  }

  /* ===== Notes mode (markdown-ish) ===== */
  .notes {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px; line-height: 1.7;
  }
  .notes h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--maize); margin: 22px 0 10px; letter-spacing: .02em; }
  .notes h2:first-child { margin-top: 0; }
  .notes h3 { font-size: 16px; font-weight: 800; margin: 18px 0 8px; color: var(--text); }
  .notes p { color: var(--text-dim); margin: 8px 0; }
  .notes ul, .notes ol { padding-left: 22px; color: var(--text-dim); margin: 8px 0; }
  .notes li { margin: 4px 0; }
  .notes code { font-family: 'JetBrains Mono', monospace; background: var(--card-2); padding: 2px 6px; border-radius: 4px; font-size: 12.5px; color: var(--maize); }
  .notes strong { color: var(--text); }
  .notes table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13.5px; }
  .notes th { background: var(--card-2); color: var(--text); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  .notes td { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--text-dim); }
  .notes .placeholder-callout {
    background: rgba(255,203,5,.06); border: 1px dashed rgba(255,203,5,.3);
    padding: 14px 18px; border-radius: 10px; margin: 12px 0;
    color: var(--maize); font-size: 13.5px;
  }

  /* ===== Formulas mode ===== */
  .formula-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px; margin-top: 14px;
  }
  .formula-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px;
    transition: all .15s ease;
  }
  .formula-card:hover { border-color: var(--maize); }
  .formula-card .name { font-weight: 800; font-size: 14px; color: var(--maize); }
  .formula-card .tex {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    background: var(--card-2); padding: 10px 14px; border-radius: 8px;
    margin: 10px 0; color: var(--text); text-align: center;
    overflow-x: auto;
  }
  .formula-card .desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }

  /* ===== Cards mode ===== */
  .card-stage {
    perspective: 1200px;
    margin: 14px 0;
    min-height: 360px;
  }
  .card {
    position: relative; width: 100%; min-height: 360px;
    transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.7,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 22px; padding: 36px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .card-face.front {
    background: linear-gradient(160deg, var(--card) 0%, #202633 100%);
  }
  .card-face.front::before {
    content: ""; position: absolute; inset: 0; border-radius: 22px;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,203,5,.18), transparent 60%);
    pointer-events: none;
  }
  .card-face.back {
    background: linear-gradient(160deg, #1a1f2c 0%, var(--card-2) 100%);
    transform: rotateY(180deg);
  }
  .card-face .tag {
    font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    color: var(--maize); margin-bottom: 18px;
  }
  .card-face .term { font-size: 26px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; color: var(--text); }
  .card-face .defn { font-size: 17px; line-height: 1.55; color: #d9dde6; max-width: 700px; }
  .card-face .tap { font-size: 12px; color: var(--text-dim); margin-top: auto; opacity: .75; }

  .card-controls {
    display: grid; grid-template-columns: auto 1fr auto auto auto auto; gap: 10px;
    align-items: center; margin-top: 18px;
  }
  .btn {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 11px 18px; border-radius: 12px; font-weight: 700; font-size: 13.5px;
    transition: all .15s ease;
  }
  .btn:hover { background: var(--card-2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(135deg, var(--maize), var(--maize-glow)); color: #1a1a1a; border-color: transparent; }
  .btn.again { background: rgba(239,68,68,.15); color: #fca5a5; border-color: rgba(239,68,68,.4); }
  .btn.hard  { background: rgba(251,191,36,.12); color: #fde68a; border-color: rgba(251,191,36,.4); }
  .btn.good  { background: rgba(34,197,94,.15); color: #86efac; border-color: rgba(34,197,94,.4); }
  .btn.easy  { background: rgba(34,197,94,.22); color: #bbf7d0; border-color: rgba(34,197,94,.5); }

  /* ===== Flash mode ===== */
  .flash-stage {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 28px;
  }
  .flash-progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .flash-progress > div { height: 100%; background: linear-gradient(90deg, var(--maize), var(--maize-glow)); transition: width .35s ease; }
  .flash-q { font-size: 18px; line-height: 1.5; margin-bottom: 18px; color: var(--text); }
  .flash-q code { font-family: 'JetBrains Mono', monospace; background: var(--card-2); padding: 2px 6px; border-radius: 4px; color: var(--maize); }
  .flash-option {
    width: 100%; text-align: left; padding: 14px 18px; border-radius: 12px;
    background: var(--card-2); border: 1px solid var(--line); color: var(--text);
    font-size: 14.5px; cursor: pointer; margin-bottom: 10px;
    transition: all .15s ease;
    display: flex; align-items: center; gap: 12px;
  }
  .flash-option:hover { border-color: var(--maize); }
  .flash-option .letter {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--line); display: grid; place-items: center;
    font-weight: 800; font-size: 12px; flex-shrink: 0;
    color: var(--text);
  }
  .flash-option.correct { background: rgba(34,197,94,.12); border-color: var(--good); color: #bbf7d0; }
  .flash-option.correct .letter { background: var(--good); color: #052e16; }
  .flash-option.wrong { background: rgba(239,68,68,.12); border-color: var(--bad); color: #fecaca; }
  .flash-option.wrong .letter { background: var(--bad); color: #450a0a; }
  .flash-feedback { margin-top: 16px; padding: 14px 18px; border-radius: 10px; font-size: 13.5px; line-height: 1.55; }
  .flash-feedback.good { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.4); color: #bbf7d0; }
  .flash-feedback.bad { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.4); color: #fecaca; }
  .flash-empty { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  .flash-score { font-family: 'Bebas Neue', sans-serif; font-size: 64px;
    background: linear-gradient(135deg, var(--maize), var(--maize-glow));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1; margin-bottom: 8px;
  }

  /* ===== Formula Sheet mode ===== */
  .cheat-sheet { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  .cheat-sheet h3 { color: var(--maize); margin-bottom: 12px; font-size: 16px; }
  .cheat-row {
    display: grid; grid-template-columns: 200px 1fr; gap: 14px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    align-items: center;
  }
  .cheat-row:last-child { border-bottom: 0; }
  .cheat-row .name { font-weight: 700; color: var(--text); font-size: 14px; }
  .cheat-row .tex {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    color: var(--text);
    background: var(--card-2); padding: 8px 12px; border-radius: 6px;
  }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--card-2); border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; color: var(--text);
    box-shadow: var(--shadow); z-index: 100;
    animation: toastIn .25s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  footer { text-align: center; padding: 20px 16px 32px; color: var(--text-mute); font-size: 12px; }

  @media (max-width: 720px) {
    .home-stats { grid-template-columns: repeat(2, 1fr); }
    .chapter-grid { grid-template-columns: 1fr; }
    .formula-grid { grid-template-columns: 1fr; }
    .search input { width: 150px; }
    .search input:focus { width: 170px; }
    .cheat-row { grid-template-columns: 1fr; gap: 4px; }
    .card-controls { grid-template-columns: 1fr 1fr; }
    .card-controls .counter { grid-column: 1 / -1; text-align: center; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand" data-route="/">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/>
      </svg>
    </div>
    <div>
      <div class="title">PHYS-150 · Study Spot</div>
      <div class="sub">General Physics I · UM-Dearborn</div>
    </div>
  </div>
  <div id="crumbs" class="crumbs"></div>
  <div class="toolbar">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="globalSearch" placeholder="Search formulas… ( / )" />
    </div>
    <span class="kbd-hint">/</span>
  </div>
</div>

<main id="root" class="view"></main>

<footer>Built from your class notes · <span style="color:var(--maize);">📚 3 verified chapters</span> · Go Blue 🐺</footer>

<script src="phys150-data.js"></script>
<script>
/* ================== ROUTER ================== */
const $ = (sel) => document.querySelector(sel);
const root = $('#root');

function go(path) {
  if (location.hash !== '#' + path) { location.hash = path; return; }
  render(path);
}
function render(path) {
  const [pathOnly, qs] = path.split('?');
  const params = new URLSearchParams(q || '');
  root.style.animation = 'none'; void root.offsetWidth; root.style.animation = '';
  if (pathOnly === '/' || pathOnly === '')        return viewHome();
  const chMatch = pathOnly.match(/^\/c\/(\d+)(?:\/(notes|cards|flash|sheet))?$/);
  if (chMatch) return viewChapter(+chMatch[1], chMatch[2] || 'overview', params);
  root.innerHTML = notFound();
  window.scrollTo({top:0});
}
window.addEventListener('hashchange', () => render(location.hash.slice(1) || '/'));

function crumbFor(path) {
  if (path.startsWith('/c/')) {
    const id = +path.split('/')[2].split('?')[0];
    const ch = PHYS150.chapters.find(c => c.num === id);
    return ch ? `Ch ${ch.num} · ${ch.title}` : 'Chapter';
  }
  return 'Home';
}

function updateCrumbs(path) {
  const c = $('#crumbs');
  const pathOnly = path.split('?')[0];
  if (pathOnly === '/' || pathOnly === '') {
    c.innerHTML = '';
    return;
  }
  c.innerHTML = `
    <span class="crumb" data-route="/">Home</span>
    <span class="sep">›</span>
    <span class="crumb current">${crumbFor(path)}</span>`;
}

/* ================== HOME ================== */
function viewHome() {
  updateCrumbs('/');
  const ch = PHYS150.chapters;
  const verified = ch.filter(c => c.verified);
  const totalCards = verified.reduce((n, c) => n + (c.cards?.length || 0), 0);
  const totalFormulas = verified.reduce((n, c) => n + (c.formulas?.length || 0), 0);
  const totalFlash = verified.reduce((n, c) => n + (c.flash?.length || 0), 0);
  const due = phys150_dueCount();

  const tiles = ch.map(c => `
    <div class="chapter-tile ${c.verified ? 'verified' : ''}" data-route="/c/${c.num}">
      <span class="num">Ch ${c.num}</span>
      <div class="title">${c.title}</div>
      <div class="sub">${c.subtitle || ''}</div>
      <div class="meta">
        ${c.verified
          ? `<span class="pill live">✓ Verified</span>
             <span class="pill">${c.formulas.length} formulas</span>
             <span class="pill">${c.cards.length} cards</span>
             <span class="pill">${c.flash.length} flash</span>`
          : `<span class="pill">⏳ Awaiting notes</span>
             <span class="pill">${c.topics?.length || 0} topics scaffolded</span>
             <span class="pill">${c.formulas.length} canonical formulas</span>`
        }
      </div>
    </div>
  `).join('');

  root.innerHTML = `
    <div class="home-hero">
      <h1>${PHYS150.meta.title}</h1>
      <div class="sub">${PHYS150.meta.school} · ${PHYS150.meta.term} · ${PHYS150.meta.instructor} · ${PHYS150.meta.credits} credits</div>
    </div>

    <div class="home-stats">
      <div class="home-stat"><div class="v">${ch.length}</div><div class="k">Chapters scaffolded</div></div>
      <div class="home-stat"><div class="v">${verified.length}</div><div class="k">Verified from your notes</div></div>
      <div class="home-stat"><div class="v">${totalFormulas + totalCards + totalFlash}</div><div class="k">Study items ready</div></div>
      <div class="home-stat"><div class="v">${due}</div><div class="k">Cards due today</div></div>
    </div>

    <div class="chapter-grid">${tiles}</div>

    <div class="cheat-sheet" style="margin-top:24px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;">
        <div>
          <div style="font-weight:800;color:var(--maize);font-size:15px;">📚 Source material</div>
          <div style="color:var(--text-dim);font-size:13px;margin-top:4px;">${PHYS150.meta.source_files.join(' · ')}</div>
        </div>
        <div style="color:var(--text-mute);font-size:12px;">
          <kbd style="background:var(--card-2);border:1px solid var(--line);padding:3px 8px;border-radius:6px;font-family:monospace;">/</kbd> search
          <kbd style="background:var(--card-2);border:1px solid var(--line);padding:3px 8px;border-radius:6px;font-family:monospace;margin-left:6px;">g</kbd> home
          <kbd style="background:var(--card-2);border:1px solid var(--line);padding:3px 8px;border-radius:6px;font-family:monospace;margin-left:6px;">←→</kbd> cards
        </div>
      </div>
    </div>
  `;
  window.scrollTo({top:0});
}

/* ================== CHAPTER VIEW ================== */
function viewChapter(num, mode, params) {
  const ch = PHYS150.chapters.find(c => c.num === num);
  if (!ch) { root.innerHTML = notFound(); return; }
  updateCrumbs(`/c/${num}`);
  if (mode === 'overview') mode = 'notes'; // default
  if (!['notes','cards','flash','sheet'].includes(mode)) mode = 'notes';

  const tabs = [
    { id: 'notes', label: '📝 Notes',    n: ch.notes_md ? 1 : 0 },
    { id: 'cards', label: '🃏 Cards',    n: ch.cards.length, badge: ch.cards.length },
    { id: 'flash', label: '🎯 Flash',    n: ch.flash.length, badge: ch.flash.length },
    { id: 'sheet', label: '📐 Sheet',    n: ch.formulas.length, badge: ch.formulas.length },
  ];
  const tabsHTML = tabs.map(t =>
    `<div class="mode-tab ${mode === t.id ? 'active' : ''}" data-mode="${t.id}">${t.label}${t.n > 0 ? ` <span style="opacity:.6;font-weight:600;margin-left:4px;">· ${t.n}</span>` : ''}</div>`
  ).join('');

  let body = '';
  if (mode === 'notes')      body = renderNotes(ch);
  else if (mode === 'cards') body = renderCards(ch);
  else if (mode === 'flash') body = renderFlash(ch);
  else if (mode === 'sheet') body = renderSheet(ch);

  root.innerHTML = `
    <div class="ch-hero">
      <div class="top">
        <span class="badge ${ch.verified ? '' : 'pending'}">${ch.verified ? '✓ Verified' : '⏳ Scaffold'}</span>
        <span style="color:var(--text-dim);">Chapter ${ch.num}</span>
        ${ch.source ? `<span style="color:var(--text-mute);font-size:12px;">· ${ch.source}</span>` : ''}
      </div>
      <h1>${ch.title}</h1>
      <div class="sub">${ch.subtitle || ''}</div>
    </div>

    <div class="mode-tabs" id="modeTabs">${tabsHTML}</div>
    <div id="modeBody">${body}</div>
  `;
  // Wire mode tabs
  document.querySelectorAll('.mode-tab').forEach(t => {
    t.onclick = () => go(`/c/${ch.num}/${t.dataset.mode}`);
  });
  // Wire cards & flash logic
  if (mode === 'cards') wireCards(ch);
  if (mode === 'flash') wireFlash(ch);
  window.scrollTo({top:0});
}

/* ----- Notes (markdown-ish) ----- */
function renderNotes(ch) {
  const md = ch.notes_md || '';
  // Tiny markdown converter (h2, h3, p, ul, ol, li, code, strong, table)
  const html = md
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^• (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.+<\/li>\n?)+/g, m => '<ul>' + m + '</ul>')
    .replace(/<\/ul>\n<ul>/g, '')
    .replace(/^(?!<h2|<h3|<ul|<li|<code|<strong|<\/p>|<\/ul>|<p>)/gm, '<p>')
    .replace(/\n<\/p>/g, '</p>')
    .replace(/<p><\/p>/g, '')
    .replace(/<\/p>\n<h2>/g, '</p>')
    .replace(/<\/p>\n<h3>/g, '</p>')
    .replace(/<p><h2>/g, '<h2>')
    .replace(/<\/h2>/g, '</h2>')
    .replace(/<p><ul>/g, '<ul>')
    .replace(/<\/ul>/g, '</ul>')
    .replace(/<p><p>/g, '<p>');
  const callout = ch.verified ? '' : '<div class="placeholder-callout">This chapter is a scaffold — the topic list and canonical formulas are filled in, but detailed notes from your class will appear here once you upload them. The cheat sheet already has the key equations.</div>';
  return `<div class="notes">${callout}<p>${html}</p></div>`;
}

/* ----- Cards (flashcard + spaced repetition) ----- */
let cardIdx = 0, cardFlipped = false, cardDeck = [];
function renderCards(ch) {
  // Filter to "due" cards first if SR state exists; else show all
  const state = phys150_loadSR();
  const now = Date.now();
  cardDeck = ch.cards.slice();
  if (Object.keys(state).length > 0) {
    cardDeck.sort((a, b) => {
      const ad = state[a.front] ? new Date(state[a.front].due).getTime() : 0;
      const bd = state[b.front] ? new Date(state[b.front].due).getTime() : 0;
      return (ad - now) - (bd - now); // due-soonest first
    });
  }
  cardIdx = 0; cardFlipped = false;
  if (!cardDeck.length) return '<div class="notes">No cards in this chapter yet.</div>';
  return `
    <div class="card-stage">
      <div class="card" id="card">
        <div class="card-face front">
          <div class="tag">Question · tap to flip</div>
          <div class="term" id="cardFront"></div>
          <div class="tap">click to reveal</div>
        </div>
        <div class="card-face back">
          <div class="tag">Answer</div>
          <div class="defn" id="cardBack"></div>
          <div class="tap">click to flip back</div>
        </div>
      </div>
    </div>
    <div class="card-controls">
      <button class="btn" id="cardPrev">← Prev</button>
      <button class="btn" id="cardShuffle">🔀 Shuffle</button>
      <div class="counter" id="cardCounter">1 / ${cardDeck.length}</div>
      <button class="btn again" data-grade="0">Again</button>
      <button class="btn hard"  data-grade="1">Hard</button>
      <button class="btn good"  data-grade="2">Good</button>
      <button class="btn easy"  data-grade="3">Easy</button>
    </div>
  `;
}
function wireCards(ch) {
  const show = () => {
    const c = cardDeck[cardIdx % cardDeck.length];
    $('#cardFront').innerHTML = c.front;
    $('#cardBack').innerHTML  = c.back;
    $('#cardCounter').textContent = `${(cardIdx % cardDeck.length) + 1} / ${cardDeck.length}`;
  };
  show();
  $('#card').onclick = () => {
    cardFlipped = !cardFlipped;
    $('#card').classList.toggle('flipped', cardFlipped);
  };
  $('#cardPrev').onclick = () => { cardIdx = (cardIdx - 1 + cardDeck.length) % cardDeck.length; cardFlipped = false; $('#card').classList.remove('flipped'); show(); };
  $('#cardShuffle').onclick = () => { cardDeck = cardDeck.slice().sort(() => Math.random() - 0.5); cardIdx = 0; cardFlipped = false; $('#card').classList.remove('flipped'); show(); };
  document.querySelectorAll('.card-controls [data-grade]').forEach(b => {
    b.onclick = () => {
      const c = cardDeck[cardIdx % cardDeck.length];
      phys150_review(c, +b.dataset.grade);
      cardIdx = (cardIdx + 1) % cardDeck.length;
      cardFlipped = false;
      $('#card').classList.remove('flipped');
      show();
      const grades = ['again','hard','good','easy'];
      toast(`Card graded: ${grades[+b.dataset.grade]}`);
    };
  });
}

/* ----- Flash Test (multiple choice) ----- */
let flashQ = null, flashOpts = [], flashAns = null, flashOrder = [], flashI = 0, flashScore = 0, flashTotal = 0;
function renderFlash(ch) {
  if (!ch.flash.length) return `<div class="flash-empty"><div style="font-size:48px;opacity:.4;">🎯</div><h3 style="margin-top:14px;color:var(--text);">No flash questions yet for this chapter</h3><p style="margin-top:8px;">Once your class notes have example problems with answers, I can auto-generate flash questions.</p></div>`;
  flashOrder = shuffle([...Array(ch.flash.length).keys()]);
  flashI = 0; flashScore = 0; flashTotal = 0;
  return `<div id="flashRoot"></div>`;
}
function wireFlash(ch) {
  const show = () => {
    if (flashI >= flashOrder.length) {
      const pct = Math.round((flashScore / flashTotal) * 100) || 0;
      $('#flashRoot').innerHTML = `
        <div class="flash-stage" style="text-align:center;">
          <div class="flash-score">${pct}%</div>
          <div style="color:var(--text-dim);">${flashScore} of ${flashTotal} correct</div>
          <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <button class="btn primary" id="flashRestart">Practice again</button>
            <button class="btn" data-route="/c/${ch.num}/cards">Review cards →</button>
          </div>
        </div>`;
      $('#flashRestart').onclick = () => { flashOrder = shuffle([...Array(ch.flash.length).keys()]); flashI = 0; flashScore = 0; flashTotal = 0; show(); };
      return;
    }
    const idx = flashOrder[flashI];
    flashQ = ch.flash[idx];
    flashOpts = flashQ.choices.slice();
    flashAns = flashQ.answer;
    const letters = ['A','B','C','D'];
    $('#flashRoot').innerHTML = `
      <div class="flash-stage">
        <div class="flash-progress"><div style="width:${((flashI) / flashOrder.length) * 100}%"></div></div>
        <div style="font-size:11px;color:var(--text-mute);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:6px;">Question ${flashI + 1} of ${flashOrder.length}</div>
        <div class="flash-q">${flashQ.prompt}</div>
        ${flashOpts.map((o, i) => `<button class="flash-option" data-i="${i}"><span class="letter">${letters[i]}</span><span>${o}</span></button>`).join('')}
        <div id="flashFeedback"></div>
        <div id="flashNext" style="margin-top:14px;text-align:right;display:none;"><button class="btn primary" id="flashNextBtn">Next →</button></div>
      </div>`;
    document.querySelectorAll('.flash-option').forEach(o => {
      o.onclick = () => {
        if (flashAns !== null) return;
        flashTotal++;
        const i = +o.dataset.i;
        if (i === flashAns) {
          o.classList.add('correct');
          flashScore++;
          $('#flashFeedback').innerHTML = `<div class="flash-feedback good">✓ Correct! ${flashQ.explanation}</div>`;
        } else {
          o.classList.add('wrong');
          document.querySelectorAll('.flash-option')[flashAns].classList.add('correct');
          $('#flashFeedback').innerHTML = `<div class="flash-feedback bad">✗ Not quite. ${flashQ.explanation}</div>`;
        }
        flashAns = i;
        $('#flashNext').style.display = 'block';
        $('#flashNextBtn').onclick = () => { flashI++; show(); };
      };
    });
  };
  show();
}

/* ----- Formula Sheet ----- */
function renderSheet(ch) {
  return `
    <div class="cheat-sheet">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <div>
          <div style="font-weight:800;color:var(--maize);">📐 Cheat sheet — Chapter ${ch.num}</div>
          <div style="color:var(--text-dim);font-size:13px;margin-top:4px;">Every formula, with the plain-English meaning.</div>
        </div>
        <div style="font-size:11px;color:var(--text-mute);">${ch.formulas.length} formulas</div>
      </div>
      ${ch.formulas.map(f => `
        <div class="cheat-row">
          <div class="name">${f.name}</div>
          <div class="tex">${escapeHtml(f.tex)}${f.desc ? `<div style="font-family:'Inter',sans-serif;font-weight:400;font-size:12px;color:var(--text-dim);margin-top:6px;">${escapeHtml(f.desc)}</div>` : ''}</div>
        </div>`).join('')}
    </div>`;
}

/* ================== HELPERS ================== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function notFound() {
  return `<div class="notes" style="text-align:center;padding:60px 20px;">
    <div style="font-size:48px;">🔍</div>
    <h2>Page not found</h2>
    <p style="margin-top:8px;">That URL doesn't match anything here.</p>
    <a class="btn primary" onclick="go('/')" style="display:inline-block;margin-top:14px;">← Back to home</a>
  </div>`;
}

/* ================== SEARCH ================== */
$('#globalSearch').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) {
    document.querySelectorAll('[data-search-hit]').forEach(el => el.removeAttribute('data-search-hit'));
    return;
  }
  // Find formulas containing the query anywhere across all verified chapters
  const hits = [];
  for (const ch of PHYS150.chapters) {
    for (const f of ch.formulas) {
      if ((f.name + ' ' + f.tex + ' ' + f.desc).toLowerCase().includes(q)) {
        hits.push({ ch: ch.num, name: f.name, tex: f.tex, desc: f.desc });
      }
    }
    for (const card of ch.cards) {
      if ((card.front + ' ' + card.back).toLowerCase().includes(q)) {
        hits.push({ ch: ch.num, name: card.front, tex: card.back, desc: card.tags?.join(', ') });
      }
    }
  }
  if (!hits.length) {
    root.innerHTML = `<div class="notes"><h2 style="margin-top:0;">No results for "${escapeHtml(q)}"</h2><p>Try a different keyword — physics terms like "velocity", "energy", "Newton", or chapter names like "ch 5".</p></div>`;
    return;
  }
  root.innerHTML = `
    <div class="home-hero">
      <h1>Search results</h1>
      <div class="sub">${hits.length} match${hits.length === 1 ? '' : 'es'} for "${escapeHtml(q)}"</div>
    </div>
    <div class="formula-grid">
      ${hits.slice(0, 30).map(h => `
        <div class="formula-card" data-route="/c/${h.ch}">
          <div class="name">${escapeHtml(h.name)}</div>
          <div class="tex">${escapeHtml(h.tex)}</div>
          <div class="desc">${escapeHtml(h.desc || '')} · Chapter ${h.ch}</div>
        </div>`).join('')}
    </div>`;
});

/* ================== CLICK HANDLER ================== */
document.addEventListener('click', (e) => {
  const navTarget = e.target.closest('[data-route]');
  if (navTarget) { e.preventDefault(); go(navTarget.dataset.route); return; }
});

/* ================== KEYBOARD ================== */
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault(); $('#globalSearch').focus();
  }
  if (e.key === 'g' && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault(); go('/');
  }
  if (e.key === 'Escape') {
    document.activeElement.blur();
    $('#globalSearch').value = '';
  }
  // Card navigation
  if ($('#card')) {
    if (e.key === ' ' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      cardFlipped = !cardFlipped;
      $('#card').classList.toggle('flipped', cardFlipped);
    }
    if (e.key === 'ArrowRight' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      cardIdx = (cardIdx + 1) % cardDeck.length;
      cardFlipped = false;
      $('#card').classList.remove('flipped');
      $('#cardFront').innerHTML = cardDeck[cardIdx].front;
      $('#cardBack').innerHTML  = cardDeck[cardIdx].back;
      $('#cardCounter').textContent = `${cardIdx + 1} / ${cardDeck.length}`;
    }
    if (e.key === 'ArrowLeft' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      cardIdx = (cardIdx - 1 + cardDeck.length) % cardDeck.length;
      cardFlipped = false;
      $('#card').classList.remove('flipped');
      $('#cardFront').innerHTML = cardDeck[cardIdx].front;
      $('#cardBack').innerHTML  = cardDeck[cardIdx].back;
      $('#cardCounter').textContent = `${cardIdx + 1} / ${cardDeck.length}`;
    }
    if (e.key === '1' || e.key === '2' || e.key === '3' || e.key === '4') {
      if (document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        const i = +e.key - 1;
        const b = document.querySelectorAll('.card-controls [data-grade]')[i];
        if (b) b.click();
      }
    }
  }
});

/* ================== TOAST ================== */
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

/* ================== INIT ================== */
window.addEventListener('DOMContentLoaded', () => render(location.hash.slice(1) || '/'));
</script>
