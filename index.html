<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Spot — The Wolverines</title>
<meta name="theme-color" content="#0b1118" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Bebas+Neue&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b1118;
    --bg-2: #0f1620;
    --card: #141b26;
    --card-2: #1a2230;
    --line: #233149;
    --text: #e8edf5;
    --text-dim: #98a4b6;
    --text-mute: #5e6a80;
    --maize: #FFCB05;
    --maize-glow: #ffe45c;
    --blue: #2e7dff;
    --blue-2: #5b9bff;
    --good: #22c55e;
    --bad: #ef4444;
    --shadow: 0 12px 32px rgba(0,0,0,.45);
    --shadow-hover: 0 18px 48px rgba(0,0,0,.6);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 600px at 80% -10%, rgba(255,203,5,.07), transparent 60%),
      radial-gradient(900px 500px at -10% 90%, rgba(46,125,255,.08), transparent 50%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 999px; }

  /* ===== Topbar ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 28px; border-bottom: 1px solid var(--line);
    background: rgba(11,17,24,.85); backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 50;
  }
  .brand { display: flex; gap: 12px; align-items: center; cursor: pointer; }
  .brand .logo {
    width: 38px; height: 38px; border-radius: 11px;
    background: linear-gradient(135deg, var(--maize) 0%, #e0a800 100%);
    display: grid; place-items: center; color: #1a1a1a;
    box-shadow: 0 6px 20px rgba(255,203,5,.25);
  }
  .brand .logo svg { width: 22px; height: 22px; }
  .brand .title { font-weight: 800; font-size: 15px; letter-spacing: -.01em; }
  .brand .sub   { font-size: 11px; color: var(--text-dim); letter-spacing: .04em; }
  .crumbs { display: flex; gap: 8px; align-items: center; color: var(--text-dim); font-size: 13px; flex: 1; margin-left: 16px; min-width: 0; overflow: hidden; }
  .crumbs .crumb { color: var(--text-dim); cursor: pointer; transition: color .15s ease; white-space: nowrap; }
  .crumbs .crumb:hover { color: var(--maize); }
  .crumbs .crumb.current { color: var(--text); cursor: default; }
  .crumbs .sep { color: var(--text-mute); }
  .toolbar { display: flex; align-items: center; gap: 10px; }
  .search { position: relative; }
  .search input {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 9px 14px 9px 36px; border-radius: 10px; font: inherit;
    width: 220px; outline: none; transition: all .15s ease;
  }
  .search input:focus { border-color: var(--maize); width: 280px; }
  .search input::placeholder { color: var(--text-mute); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-mute); }
  .kbd-hint { font-size: 10px; color: var(--text-mute); }

  /* ===== View ===== */
  .view {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px 80px;
    animation: viewIn .35s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes viewIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== Landing: Who's studying? ===== */
  .who-pad { padding: 36px 8px 0; text-align: center; }
  .who-tag {
    display: inline-block;
    background: rgba(255,203,5,.12);
    border: 1px solid rgba(255,203,5,.3);
    color: var(--maize);
    font-size: 11px; font-weight: 800;
    letter-spacing: .18em; text-transform: uppercase;
    padding: 7px 14px; border-radius: 999px;
  }
  .who-h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(48px, 9vw, 88px);
    letter-spacing: .01em; line-height: 1;
    background: linear-gradient(135deg, var(--maize-glow), #ffffff 50%, var(--maize));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 16px 0 10px;
  }
  .who-sub { color: var(--text-dim); font-size: 16px; max-width: 540px; margin: 0 auto 36px; }

  .roster-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
    margin-top: 32px;
  }
  .roommate {
    background: linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 18px;
    text-align: left;
    cursor: pointer;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .25s ease, box-shadow .25s ease;
    position: relative;
    overflow: hidden;
  }
  .roommate::before {
    content: ""; position: absolute; inset: -1px; border-radius: 18px;
    background: linear-gradient(135deg, var(--maize), var(--blue));
    opacity: 0; transition: opacity .25s ease; pointer-events: none;
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    padding: 1px;
  }
  .roommate:hover { transform: translateY(-4px); border-color: transparent; box-shadow: var(--shadow-hover); }
  .roommate:hover::before { opacity: 1; }
  .roommate .avatar {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--card-2);
    border: 2px solid var(--line);
    display: grid; place-items: center; font-weight: 800; font-size: 22px;
    margin-bottom: 14px;
    color: var(--maize);
    overflow: hidden;
    transition: transform .35s cubic-bezier(.2,.7,.2,1), border-color .25s ease;
  }
  .roommate:hover .avatar { transform: scale(1.06); border-color: var(--maize); }
  .roommate .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .roommate .name { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
  .roommate .meta { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .roommate .tag {
    display: inline-block; margin-top: 12px;
    background: var(--card-2);
    border: 1px solid var(--line);
    color: var(--text-dim);
    padding: 4px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; letter-spacing: .04em;
  }
  .roommate .tag.live { color: var(--maize); border-color: rgba(255,203,5,.35); background: rgba(255,203,5,.07); }

  .house-cta {
    margin-top: 48px;
    padding: 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .house-cta .txt { color: var(--text-dim); font-size: 14px; }
  .house-cta .txt b { color: var(--text); }

  /* ===== Student dashboard (class grid) ===== */
  .stu-hero { padding: 24px 8px 4px; }
  .stu-hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 7vw, 64px);
    letter-spacing: .01em; line-height: 1;
    background: linear-gradient(135deg, var(--maize-glow), var(--maize));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .stu-hero .sub { color: var(--text-dim); margin-top: 6px; font-size: 14px; }
  .stu-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 22px 0 6px; }
  .stu-stat {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
  }
  .stu-stat .v { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--maize); }
  .stu-stat .k { font-size: 10.5px; color: var(--text-dim); margin-top: 4px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }

  .class-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px; margin-top: 22px;
  }
  .class-tile {
    position: relative;
    background: linear-gradient(160deg, var(--card) 0%, var(--card-2) 100%);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 18px 18px;
    cursor: pointer;
    overflow: hidden;
    transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .25s ease, box-shadow .25s ease;
  }
  .class-tile::after {
    content: ""; position: absolute; right: -40px; top: -40px;
    width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,203,5,.08), transparent 70%);
    opacity: 0; transition: opacity .3s ease;
  }
  .class-tile:hover { transform: translateY(-3px); border-color: var(--maize); box-shadow: var(--shadow-hover); }
  .class-tile:hover::after { opacity: 1; }
  .class-tile .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 600;
    color: var(--maize);
    background: rgba(255,203,5,.1);
    border: 1px solid rgba(255,203,5,.25);
    padding: 4px 8px; border-radius: 6px;
    display: inline-block;
    margin-bottom: 10px;
  }
  .class-tile.has-hub .code { color: var(--good); background: rgba(34,197,94,.12); border-color: rgba(34,197,94,.4); }
  .class-tile .name { font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
  .class-tile .meta { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  .class-tile .progress {
    margin-top: 14px;
    height: 6px; background: var(--line); border-radius: 999px; overflow: hidden;
  }
  .class-tile .progress > div {
    height: 100%;
    background: linear-gradient(90deg, var(--maize), var(--maize-glow));
    border-radius: 999px;
    transition: width .5s cubic-bezier(.2,.7,.2,1);
  }
  .class-tile .progress-label {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--text-dim); margin-top: 6px;
    font-weight: 700; letter-spacing: .04em;
  }

  /* ===== Class hub (mode tabs) ===== */
  .hub-hero { padding: 22px 8px 0; }
  .hub-hero .top {
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
  }
  .hub-hero .code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 700;
    color: var(--maize);
    background: rgba(255,203,5,.1);
    border: 1px solid rgba(255,203,5,.3);
    padding: 6px 12px; border-radius: 8px;
  }
  .hub-hero h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(40px, 7vw, 60px);
    letter-spacing: .01em; line-height: 1; color: var(--text);
    margin: 8px 0 4px;
  }
  .hub-hero .sub { color: var(--text-dim); }

  .mode-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 22px 0 16px; }
  .mode-tab {
    background: var(--card); border: 1px solid var(--line); color: var(--text-dim);
    padding: 11px 16px; border-radius: 12px;
    font-weight: 700; font-size: 13.5px;
    transition: all .15s ease;
  }
  .mode-tab:hover { background: var(--card-2); color: var(--text); }
  .mode-tab.active {
    background: linear-gradient(135deg, var(--maize), var(--maize-glow));
    color: #1a1a1a; border-color: transparent;
    box-shadow: 0 6px 18px rgba(255,203,5,.25);
  }

  .empty-state {
    margin-top: 18px;
    padding: 32px;
    background: var(--card);
    border: 1px dashed var(--line);
    border-radius: 16px;
    text-align: center;
  }
  .empty-state .ico {
    width: 60px; height: 60px; border-radius: 16px;
    background: var(--card-2);
    display: grid; place-items: center; margin: 0 auto 12px;
    color: var(--maize);
  }
  .empty-state h3 { font-size: 18px; font-weight: 800; }
  .empty-state p { color: var(--text-dim); margin-top: 6px; max-width: 460px; margin-left: auto; margin-right: auto; }
  .empty-state .cta {
    margin-top: 16px; display: inline-block;
    background: var(--maize);
    color: #1a1a1a;
    padding: 10px 18px; border-radius: 10px;
    font-weight: 800; font-size: 13.5px;
    box-shadow: 0 6px 18px rgba(255,203,5,.25);
    transition: transform .15s ease; cursor: pointer;
  }
  .empty-state .cta:hover { transform: translateY(-2px); }

  /* ===== PHYS-150 study interface (per chapter) ===== */
  .notes {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 28px; line-height: 1.7;
  }
  .notes h2 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: var(--maize); margin: 22px 0 10px; letter-spacing: .02em; }
  .notes h2:first-child { margin-top: 0; }
  .notes h3 { font-size: 16px; font-weight: 800; margin: 18px 0 8px; color: var(--text); }
  .notes p { color: var(--text-dim); margin: 8px 0; }
  .notes ul, .notes ol { padding-left: 22px; color: var(--text-dim); margin: 8px 0; }
  .notes li { margin: 4px 0; }
  .notes code { font-family: 'JetBrains Mono', monospace; background: var(--card-2); padding: 2px 6px; border-radius: 4px; font-size: 12.5px; color: var(--maize); }
  .notes strong { color: var(--text); }
  .notes table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 13.5px; }
  .notes th { background: var(--card-2); color: var(--text); padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); }
  .notes td { padding: 8px 12px; border-bottom: 1px solid var(--line); color: var(--text-dim); }
  .notes .placeholder-callout {
    background: rgba(255,203,5,.06); border: 1px dashed rgba(255,203,5,.3);
    padding: 14px 18px; border-radius: 10px; margin: 12px 0;
    color: var(--maize); font-size: 13.5px;
  }

  .formula-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 12px; margin-top: 14px;
  }
  .formula-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px 18px;
    transition: all .15s ease;
  }
  .formula-card:hover { border-color: var(--maize); }
  .formula-card .name { font-weight: 800; font-size: 14px; color: var(--maize); }
  .formula-card .tex {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    background: var(--card-2); padding: 10px 14px; border-radius: 8px;
    margin: 10px 0; color: var(--text); text-align: center;
    overflow-x: auto;
  }
  .formula-card .desc { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }

  .card-stage { perspective: 1200px; margin: 14px 0; min-height: 360px; }
  .card {
    position: relative; width: 100%; min-height: 360px;
    transform-style: preserve-3d; transition: transform .55s cubic-bezier(.2,.7,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border-radius: 22px; padding: 36px;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    text-align: center; box-shadow: var(--shadow); border: 1px solid var(--line);
  }
  .card-face.front { background: linear-gradient(160deg, var(--card) 0%, #202633 100%); }
  .card-face.front::before {
    content: ""; position: absolute; inset: 0; border-radius: 22px;
    background: radial-gradient(ellipse at 50% 0%, rgba(255,203,5,.18), transparent 60%);
    pointer-events: none;
  }
  .card-face.back { background: linear-gradient(160deg, #1a1f2c 0%, var(--card-2) 100%); transform: rotateY(180deg); }
  .card-face .tag { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--maize); margin-bottom: 18px; }
  .card-face .term { font-size: 26px; font-weight: 800; letter-spacing: -.01em; line-height: 1.25; color: var(--text); }
  .card-face .defn { font-size: 17px; line-height: 1.55; color: #d9dde6; max-width: 700px; }
  .card-face .tap { font-size: 12px; color: var(--text-dim); margin-top: auto; opacity: .75; }

  .card-controls {
    display: grid; grid-template-columns: auto 1fr auto auto auto auto; gap: 10px;
    align-items: center; margin-top: 18px;
  }
  .btn {
    background: var(--card); border: 1px solid var(--line); color: var(--text);
    padding: 11px 18px; border-radius: 12px; font-weight: 700; font-size: 13.5px;
    transition: all .15s ease;
  }
  .btn:hover { background: var(--card-2); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(135deg, var(--maize), var(--maize-glow)); color: #1a1a1a; border-color: transparent; }
  .btn.again { background: rgba(239,68,68,.15); color: #fca5a5; border-color: rgba(239,68,68,.4); }
  .btn.hard  { background: rgba(251,191,36,.12); color: #fde68a; border-color: rgba(251,191,36,.4); }
  .btn.good  { background: rgba(34,197,94,.15); color: #86efac; border-color: rgba(34,197,94,.4); }
  .btn.easy  { background: rgba(34,197,94,.22); color: #bbf7d0; border-color: rgba(34,197,94,.5); }

  .flash-stage {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 28px;
  }
  .flash-progress { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; margin-bottom: 20px; }
  .flash-progress > div { height: 100%; background: linear-gradient(90deg, var(--maize), var(--maize-glow)); transition: width .35s ease; }
  .flash-q { font-size: 18px; line-height: 1.5; margin-bottom: 18px; color: var(--text); }
  .flash-q code { font-family: 'JetBrains Mono', monospace; background: var(--card-2); padding: 2px 6px; border-radius: 4px; color: var(--maize); }
  .flash-option {
    width: 100%; text-align: left; padding: 14px 18px; border-radius: 12px;
    background: var(--card-2); border: 1px solid var(--line); color: var(--text);
    font-size: 14.5px; cursor: pointer; margin-bottom: 10px;
    transition: all .15s ease;
    display: flex; align-items: center; gap: 12px;
  }
  .flash-option:hover { border-color: var(--maize); }
  .flash-option .letter {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--line); display: grid; place-items: center;
    font-weight: 800; font-size: 12px; flex-shrink: 0;
    color: var(--text);
  }
  .flash-option.correct { background: rgba(34,197,94,.12); border-color: var(--good); color: #bbf7d0; }
  .flash-option.correct .letter { background: var(--good); color: #052e16; }
  .flash-option.wrong { background: rgba(239,68,68,.12); border-color: var(--bad); color: #fecaca; }
  .flash-option.wrong .letter { background: var(--bad); color: #450a0a; }
  .flash-feedback { margin-top: 16px; padding: 14px 18px; border-radius: 10px; font-size: 13.5px; line-height: 1.55; }
  .flash-feedback.good { background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.4); color: #bbf7d0; }
  .flash-feedback.bad { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.4); color: #fecaca; }
  .flash-empty { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  .flash-score { font-family: 'Bebas Neue', sans-serif; font-size: 64px;
    background: linear-gradient(135deg, var(--maize), var(--maize-glow));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    line-height: 1; margin-bottom: 8px;
  }

  .cheat-sheet { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px; }
  .cheat-sheet h3 { color: var(--maize); margin-bottom: 12px; font-size: 16px; }
  .cheat-row {
    display: grid; grid-template-columns: 200px 1fr; gap: 14px;
    padding: 10px 0; border-bottom: 1px solid var(--line);
    align-items: center;
  }
  .cheat-row:last-child { border-bottom: 0; }
  .cheat-row .name { font-weight: 700; color: var(--text); font-size: 14px; }
  .cheat-row .tex {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    color: var(--text);
    background: var(--card-2); padding: 8px 12px; border-radius: 6px;
  }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--card-2); border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 999px;
    font-size: 13px; color: var(--text);
    box-shadow: var(--shadow); z-index: 100;
    animation: toastIn .25s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }

  footer { text-align: center; padding: 20px 16px 32px; color: var(--text-mute); font-size: 12px; }
  footer .go-blue { color: var(--maize); font-weight: 700; letter-spacing: .04em; }

  @media (max-width: 720px) {
    .stu-stats { grid-template-columns: repeat(2, 1fr); }
    .class-grid { grid-template-columns: 1fr; }
    .formula-grid { grid-template-columns: 1fr; }
    .search input { width: 150px; }
    .search input:focus { width: 170px; }
    .cheat-row { grid-template-columns: 1fr; gap: 4px; }

/* ================== PHYS-150 STUDY INTERFACE ================== */
function viewPhys150(mode) {

function renderPhysNotes() {
  const ch = PHYS150.chapters.filter(c => c.verified);
  let html = `
    <div class="notes">
      <h2>${PHYS150.meta.title}</h2>
      <p style="color:var(--text);">${PHYS150.meta.school} · ${PHYS150.meta.term} · ${PHYS150.meta.instructor} · ${PHYS150.meta.credits} credits</p>
      <p style="font-size:13px;color:var(--text-mute);margin-top:6px;">Source: ${PHYS150.meta.source_files.join(' · ')}</p>
      <div style="margin:18px 0 8px;display:flex;flex-wrap:wrap;gap:8px;">
        ${ch.map(c => `<a class="btn" href="#/u/dylan/PHYS-150/sheet" data-ch="${c.num}" style="cursor:pointer;text-decoration:none;">📐 Ch ${c.num} formulas</a>`).join('')}
      </div>
      ${ch.map(c => renderPhysChapterNotes(c)).join('')}
      ${PHYS150.chapters.filter(c => !c.verified).map(c => `
        <h2>Chapter ${c.num} · ${c.title} <span style="font-size:13px;color:var(--text-mute);font-weight:400;">(scaffold — awaiting notes)</span></h2>
        <p>${c.summary || ''}</p>
        <div class="placeholder-callout">Topic list and canonical formulas are scaffolded. Detailed notes from your class will appear here once uploaded.</div>
      `).join('')}
    </div>
  `;
  return html;
}

function renderPhysChapterNotes(c) {
  const md = c.notes_md || '';
  // Tiny markdown converter
  const html = md
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\n\n/g, '</p><p>')
    .replace(/^• (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.+<\/li>\n?)+/g, m => '<ul>' + m + '</ul>')
    .replace(/<\/ul>\n<ul>/g, '')
    .replace(/<\/p>\n<h2>/g, '</p>')
    .replace(/<\/p>\n<h3>/g, '</p>')
    .replace(/<p><h2>/g, '<h2>')
    .replace(/<p><ul>/g, '<ul>')
    .replace(/<p><p>/g, '<p>')
    .replace(/<p><\/p>/g, '');
  return `<h2>Chapter ${c.num} · ${c.title}</h2>
    <div style="font-size:11px;color:var(--good);font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;">✓ Verified · from ${c.source || 'your class notes'}</div>
    <p>${html}</p>`;
}

/* ----- Cards ----- */
let physCardIdx = 0, physCardFlipped = false, physCardDeck = [];
function renderPhysCards() {
  const ch = PHYS150.chapters.filter(c => c.verified);
  physCardDeck = [];
  for (const c of ch) for (const card of c.cards) physCardDeck.push({ ...card, ch: c.num });
  const state = phys150_loadSR();
  if (Object.keys(state).length > 0) {
    physCardDeck.sort((a, b) => {
      const ad = state[a.front] ? new Date(state[a.front].due).getTime() : 0;
      const bd = state[b.front] ? new Date(state[b.front].due).getTime() : 0;
      return (ad - Date.now()) - (bd - Date.now());
    });
  }
  physCardIdx = 0; physCardFlipped = false;
  if (!physCardDeck.length) return `<div class="empty-state"><div class="ico">🃏</div><h3>No cards yet</h3><p>Cards will appear here once you upload more chapter notes.</p></div>`;
  return `
    <div class="card-stage">
      <div class="card" id="physCard">
        <div class="card-face front">
          <div class="tag" id="physCardTag">Question · tap to flip</div>
          <div class="term" id="physCardFront"></div>
          <div class="tap">click to reveal</div>
        </div>
        <div class="card-face back">
          <div class="tag">Answer</div>
          <div class="defn" id="physCardBack"></div>
          <div class="tap">click to flip back</div>
        </div>
      </div>
    </div>
    <div class="card-controls">
      <button class="btn" id="physCardPrev">← Prev</button>
      <button class="btn" id="physCardShuffle">🔀 Shuffle</button>
      <div class="counter" id="physCardCounter">1 / ${physCardDeck.length}</div>
      <button class="btn again" data-grade="0">Again</button>
      <button class="btn hard"  data-grade="1">Hard</button>
      <button class="btn good"  data-grade="2">Good</button>
      <button class="btn easy"  data-grade="3">Easy</button>
    </div>
  `;
}
function wirePhysCards() {
  const show = () => {
    const c = physCardDeck[physCardIdx % physCardDeck.length];
    $('#physCardFront').innerHTML = c.front;
    $('#physCardBack').innerHTML  = c.back;
    $('#physCardCounter').textContent = `${(physCardIdx % physCardDeck.length) + 1} / ${physCardDeck.length}`;
    $('#physCardTag').textContent = `Question · Ch ${c.ch} · tap to flip`;
  };
  show();
  $('#physCard').onclick = () => {
    physCardFlipped = !physCardFlipped;
    $('#physCard').classList.toggle('flipped', physCardFlipped);
  };
  $('#physCardPrev').onclick = () => { physCardIdx = (physCardIdx - 1 + physCardDeck.length) % physCardDeck.length; physCardFlipped = false; $('#physCard').classList.remove('flipped'); show(); };
  $('#physCardShuffle').onclick = () => { physCardDeck.sort(() => Math.random() - 0.5); physCardIdx = 0; physCardFlipped = false; $('#physCard').classList.remove('flipped'); show(); };
  document.querySelectorAll('.card-controls [data-grade]').forEach(b => {
    b.onclick = () => {
      const c = physCardDeck[physCardIdx % physCardDeck.length];
      phys150_review(c, +b.dataset.grade);
      physCardIdx = (physCardIdx + 1) % physCardDeck.length;
      physCardFlipped = false;
      $('#physCard').classList.remove('flipped');
      show();
      const grades = ['again','hard','good','easy'];
      toast(`Card graded: ${grades[+b.dataset.grade]}`);
    };
  });
}

/* ----- Flash ----- */
let physFlashOrder = [], physFlashI = 0, physFlashScore = 0, physFlashTotal = 0, physFlashQ = null, physFlashAns = null;
function renderPhysFlash() {
  const ch = PHYS150.chapters.filter(c => c.verified);
  const allQ = [];
  for (const c of ch) for (const q of c.flash) allQ.push({ ...q, ch: c.num });

  physFlashOrder = shuffle([...Array(allQ.length).keys()]);
  physFlashI = 0; physFlashScore = 0; physFlashTotal = 0;
  return `<div id="physFlashRoot"></div>`;
}
function wirePhysFlash() {
  const ch = PHYS150.chapters.filter(c => c.verified);
  const allQ = [];
  for (const c of ch) for (const q of c.flash) allQ.push({ ...q, ch: c.num });

    if (physFlashI >= physFlashOrder.length) {
      const pct = Math.round((physFlashScore / physFlashTotal) * 100) || 0;
      $('#physFlashRoot').innerHTML = `
        <div class="flash-stage" style="text-align:center;">
          <div class="flash-score">${pct}%</div>

          <div style="margin-top:18px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
            <button class="btn primary" id="physFlashRestart">Practice again</button>
            <button class="btn" data-route="/u/dylan/PHYS-150/notes">Review notes →</button>
          </div>
        </div>`;
      $('#physFlashRestart').onclick = () => { physFlashOrder = shuffle([...Array(allQ.length).keys()]); physFlashI = 0; physFlashScore = 0; physFlashTotal = 0; show(); };
      return;
    }
    const idx = physFlashOrder[physFlashI];
    physFlashQ = allQ[idx];
    physFlashAns = null;
    const letters = ['A','B','C','D'];
    $('#physFlashRoot').innerHTML = `
      <div class="flash-stage">
        <div class="flash-progress"><div style="width:${((physFlashI) / physFlashOrder.length) * 100}%"></div></div>
        <div style="font-size:11px;color:var(--text-mute);letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:6px;">Question ${physFlashI + 1} of ${physFlashOrder.length} · Chapter ${physFlashQ.ch}</div>
        <div class="flash-q">${physFlashQ.prompt}</div>
        ${physFlashQ.choices.map((o, i) => `<button class="flash-option" data-i="${i}"><span class="letter">${letters[i]}</span><span>${o}</span></button>`).join('')}
        <div id="physFlashFeedback"></div>
        <div id="physFlashNext" style="margin-top:14px;text-align:right;display:none;"><button class="btn primary" id="physFlashNextBtn">Next →</button></div>
      </div>`;
    document.querySelectorAll('.flash-option').forEach(o => {
      o.onclick = () => {
        if (physFlashAns !== null) return;
        physFlashTotal++;
        const i = +o.dataset.i;
        if (i === physFlashQ.answer) {
          o.classList.add('correct');
          physFlashScore++;
          $('#physFlashFeedback').innerHTML = `<div class="flash-feedback good">✓ Correct! ${physFlashQ.explanation}</div>`;
        } else {
          o.classList.add('wrong');
          document.querySelectorAll('.flash-option')[physFlashQ.answer].classList.add('correct');
          $('#physFlashFeedback').innerHTML = `<div class="flash-feedback bad">✗ Not quite. ${physFlashQ.explanation}</div>`;
        }
        physFlashAns = i;
        $('#physFlashNext').style.display = 'block';
        $('#physFlashNextBtn').onclick = () => { physFlashI++; show(); };
      };
    });
  };
  show();
}

/* ----- Sheet (cheat sheets per chapter) ----- */
function renderPhysSheet() {
  const ch = PHYS150.chapters.filter(c => c.verified);
  return ch.map(c => `
    <div class="cheat-sheet" style="margin-bottom:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px;">
        <div>
          <div style="font-weight:800;color:var(--maize);">📐 Chapter ${c.num} · ${c.title}</div>
          <div style="color:var(--text-dim);font-size:13px;margin-top:4px;">${c.formulas.length} formulas · ✓ verified from ${c.source}</div>
        </div>
      </div>
      ${c.formulas.map(f => `
        <div class="cheat-row">
          <div class="name">${escapeHtml(f.name)}</div>
          <div class="tex">${escapeHtml(f.tex)}${f.desc ? `<div style="font-family:'Inter',sans-serif;font-weight:400;font-size:12px;color:var(--text-dim);margin-top:6px;">${escapeHtml(f.desc)}</div>` : ''}</div>
        </div>`).join('')}
    </div>
  `).join('');
}

/* ================== HELPERS ================== */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function notFound() {
  return `<div class="notes" style="text-align:center;padding:60px 20px;">
    <div style="font-size:48px;">🔍</div>
    <h2>Page not found</h2>
    <p style="margin-top:8px;">That URL doesn't match anything here.</p>
    <a class="btn primary" onclick="go('/')" style="display:inline-block;margin-top:14px;cursor:pointer;">← Back to home</a>
  </div>`;
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}

/* ================== SEARCH ================== */
$('#globalSearch').addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const hits = [];
  if (typeof PHYS150 !== 'undefined') {
    for (const ch of PHYS150.chapters) {
      for (const f of ch.formulas) {
        if ((f.name + ' ' + f.tex + ' ' + f.desc).toLowerCase().includes(q))
          hits.push({ ch: ch.num, kind: 'Formula', name: f.name, tex: f.tex, desc: f.desc });
      }
      for (const card of ch.cards) {
        if ((card.front + ' ' + card.back).toLowerCase().includes(q))
          hits.push({ ch: ch.num, kind: 'Card', name: card.front, tex: card.back, desc: (card.tags || []).join(', ') });
      }
    }
  }
  if (!hits.length) {
    root.innerHTML = `<div class="notes"><h2 style="margin-top:0;">No results for "${escapeHtml(q)}"</h2><p>Try physics terms like "velocity", "energy", "Newton", or chapter names.</p></div>`;
    return;
  }
  root.innerHTML = `
    <div class="stu-hero">
      <h1>Search results</h1>
      <div class="sub">${hits.length} match${hits.length === 1 ? '' : 'es'} for "${escapeHtml(q)}"</div>
    </div>
    <div class="formula-grid">
      ${hits.slice(0, 30).map(h => `
        <div class="formula-card" data-route="/u/dylan/PHYS-150/sheet" style="cursor:pointer;">
          <div class="name">${escapeHtml(h.name)} <span style="color:var(--text-mute);font-weight:400;font-size:11px;">· ${h.kind} · Ch ${h.ch}</span></div>
          <div class="tex">${escapeHtml(h.tex)}</div>
          <div class="desc">${escapeHtml(h.desc || '')}</div>
        </div>`).join('')}
    </div>`;
});

/* ================== CLICK HANDLER ================== */
document.addEventListener('click', (e) => {
  const navTarget = e.target.closest('[data-route]');
  if (navTarget) { e.preventDefault(); go(navTarget.dataset.route); return; }
});

/* ================== KEYBOARD ================== */
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault(); $('#globalSearch').focus();
  }
  if (e.key === 'g' && !e.metaKey && !e.ctrlKey && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault(); go('/');
  }
  if (e.key === 'Escape') {
    document.activeElement.blur();
    $('#globalSearch').value = '';
  }
  // Card navigation
  if ($('#physCard')) {
    if (e.key === ' ' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      physCardFlipped = !physCardFlipped;
      $('#physCard').classList.toggle('flipped', physCardFlipped);
    }
    if (e.key === 'ArrowRight' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      physCardIdx = (physCardIdx + 1) % physCardDeck.length;
      physCardFlipped = false;
      $('#physCard').classList.remove('flipped');
      $('#physCardFront').innerHTML = physCardDeck[physCardIdx].front;
      $('#physCardBack').innerHTML  = physCardDeck[physCardIdx].back;
      $('#physCardCounter').textContent = `${physCardIdx + 1} / ${physCardDeck.length}`;
    }
    if (e.key === 'ArrowLeft' && document.activeElement.tagName !== 'INPUT') {
      e.preventDefault();
      physCardIdx = (physCardIdx - 1 + physCardDeck.length) % physCardDeck.length;
      physCardFlipped = false;
      $('#physCard').classList.remove('flipped');
      $('#physCardFront').innerHTML = physCardDeck[physCardIdx].front;
      $('#physCardBack').innerHTML  = physCardDeck[physCardIdx].back;
      $('#physCardCounter').textContent = `${physCardIdx + 1} / ${physCardDeck.length}`;
    }
    if (e.key === '1' || e.key === '2' || e.key === '3' || e.key === '4') {
      if (document.activeElement.tagName !== 'INPUT') {
        e.preventDefault();
        const i = +e.key - 1;
        const b = document.querySelectorAll('.card-controls [data-grade]')[i];
        if (b) b.click();
      }
    }
  }
});

/* ================== INIT ================== */
window.addEventListener('DOMContentLoaded', () => render(location.hash.slice(1) || '/'));
</script>
