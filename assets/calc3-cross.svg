<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="title desc"><title id="title">Cross product area and orientation</title><desc id="desc">In the xy plane, a points right and b points up and right. Their parallelogram is shaded. Curling right-hand fingers from a to b points the thumb out of the page, the positive z direction. Reversing the order points into the page.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#00274c"/></marker></defs><rect width="720" height="410" rx="16" fill="#f5f0e5"/><g font-family="Arial,sans-serif" fill="#00274c"><text x="30" y="42" font-size="22" font-weight="bold">Cross product: area AND orientation</text><path d="M75 265L310 265L425 100L190 100Z" fill="#ffdf68" stroke="#b59a46" stroke-width="2"/><path d="M75 265H310M75 265L190 100" stroke="#00274c" stroke-width="4" marker-end="url(#arr)"/><path d="M190 100V265" stroke="#627787" stroke-dasharray="6 5" stroke-width="2"/><text x="190" y="293" font-size="19">a</text><text x="108" y="166" font-size="19">b</text><text x="213" y="195" font-size="17">area = |a × b|</text><text x="198" y="235" font-size="15">height = |b| sin θ</text><text x="97" y="246" font-size="17">θ</text><circle cx="520" cy="130" r="22" stroke="#00274c" stroke-width="3" fill="none"/><circle cx="520" cy="130" r="5"/><text x="481" y="176" font-size="17">a × b: out (+z)</text><circle cx="520" cy="227" r="22" stroke="#00274c" stroke-width="3" fill="none"/><path d="M509 216L531 238M531 216L509 238" stroke="#00274c" stroke-width="3"/><text x="483" y="273" font-size="17">b × a: in (−z)</text><text x="30" y="337" font-size="17">Right hand: curl fingers from a toward b. Your thumb gives a × b.</text><text x="30" y="374" font-size="16">Same area, opposite normal when order reverses. Triangle area is half.</text></g></svg>