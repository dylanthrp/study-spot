<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">Projection and perpendicular residual</title><desc id="desc">Vector a is 3 right and 2 up. Its projection onto the horizontal direction b is 3 right. The residual is 2 up and perpendicular to b.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="#00274c"/></marker></defs><rect width="720" height="390" rx="16" fill="#f5f0e5"/><g font-family="Arial,sans-serif" fill="#00274c"><text x="36" y="45" font-size="22" font-weight="bold">Projection = the shadow along a direction</text><path d="M95 275H625" stroke="#b4ab98" stroke-width="2"/><path d="M95 275L395 75" stroke="#00274c" stroke-width="4" marker-end="url(#arrow)"/><path d="M95 281H395" stroke="#b57a00" stroke-width="7"/><path d="M395 275V75" stroke="#387c7a" stroke-width="3" stroke-dasharray="7 6"/><path d="M395 255H375V275" fill="none" stroke="#387c7a" stroke-width="2"/><path d="M480 275H615" stroke="#00274c" stroke-width="3" marker-end="url(#arrow)"/><text x="91" y="312" font-size="17">O</text><text x="235" y="127" font-size="21">a = ⟨3, 2⟩</text><text x="165" y="315" font-size="18">proj_b(a) = ⟨3, 0⟩</text><text x="414" y="165" font-size="17">residual = ⟨0, 2⟩</text><text x="500" y="251" font-size="18">direction b</text><text x="36" y="361" font-size="16">a = projection + residual. The residual is perpendicular to b.</text></g></svg>